<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090E" />
  <title>SpotMusic Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="bg-obsidian-900 text-white flex flex-col h-screen overflow-hidden">

  <!-- TOP APP BAR -->
  <header class="pt-[calc(var(--sat)+12px)] pb-3 px-5 flex items-center justify-between border-b border-white/5 bg-obsidian-900/80 backdrop-blur-xl z-30 flex-shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sonic-green to-sonic-emerald flex items-center justify-center shadow-lg shadow-green-500/20">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="text-black"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">
          <span>SpotMusic</span>
          <span class="text-[9px] px-1.5 py-0.2 rounded bg-sonic-green/20 text-sonic-green font-mono uppercase tracking-wider font-semibold">Pro</span>
        </h1>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- License Pill -->
      <button id="btn-open-license" class="px-2.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium flex items-center gap-1.5 transition-all">
        <span id="top-license-dot" class="w-2 h-2 rounded-full bg-yellow-400"></span>
        <span id="top-license-text" class="text-[11px] text-white/80">Licencia</span>
      </button>

      <!-- Global Search Button -->
      <button id="btn-open-search" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/15 flex items-center justify-center text-white/80 transition-all active:scale-95">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN SCREENS CONTAINER -->
  <main class="flex-1 relative overflow-hidden">

    <!-- VIEW 1: PLAYER DECK (MAIN HERO) -->
    <section id="view-player" class="absolute inset-0 flex flex-col justify-between px-6 py-4 overflow-y-auto scrollbar-none transition-all duration-300">
      
      <!-- Top Subtitle -->
      <div class="flex items-center justify-between text-xs text-white/50 select-none">
        <span class="flex items-center gap-1">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          <span id="player-view-mode-title">Reproductor Hi-Fi</span>
        </span>
        <button id="btn-player-favorite" class="p-2 text-white/40 hover:text-sonic-rose transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </button>
      </div>

      <!-- Vinyl Turntable Deck Container -->
      <div id="vinyl-deck-container" class="my-auto py-2"></div>

      <!-- Track Information -->
      <div class="text-center px-4 select-none">
        <h2 id="current-track-name" class="text-lg font-bold text-white truncate drop-shadow-md">Selecciona una canción</h2>
        <p id="current-track-artist" class="text-xs font-medium text-white/60 truncate mt-0.5">Explora el catálogo o tu biblioteca</p>
      </div>

      <!-- Waveform Visualizer & Scrubber -->
      <div id="waveform-container" class="w-full my-2"></div>

      <!-- Primary Transport Controls -->
      <div class="flex items-center justify-between px-2 pt-1 pb-2 select-none">
        <!-- Shuffle -->
        <button id="btn-shuffle" class="p-3 rounded-full text-white/40 hover:text-white transition-colors" title="Modo Aleatorio">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>

        <!-- Previous -->
        <button id="btn-prev" class="p-3 rounded-full text-white/70 hover:text-white transition-colors active:scale-90" title="Canción Anterior">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"/></svg>
        </button>

        <!-- Play / Pause (Hero Glowing Button) -->
        <button id="btn-play-pause" class="w-16 h-16 rounded-full bg-sonic-green hover:bg-emerald-400 text-black flex items-center justify-center shadow-lg shadow-green-500/40 transition-all active:scale-95" title="Reproducir / Pausa">
          <svg id="icon-play-hero" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          <svg id="icon-pause-hero" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>

        <!-- Next -->
        <button id="btn-next" class="p-3 rounded-full text-white/70 hover:text-white transition-colors active:scale-90" title="Siguiente Canción">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"/></svg>
        </button>

        <!-- Repeat -->
        <button id="btn-repeat" class="p-3 rounded-full text-white/40 hover:text-white transition-colors" title="Repetir">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <!-- Secondary Quick Action Deck (Queue, EQ, Timer) -->
      <div class="flex items-center justify-center gap-4 pt-1 pb-4 select-none">
        <button id="btn-open-queue" class="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-white/70 hover:text-white flex items-center gap-1.5 transition-all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>Cola</span>
          <span id="player-queue-count" class="text-[10px] px-1.5 rounded-full bg-white/10 font-mono">0</span>
        </button>

        <button id="btn-open-eq" class="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-white/70 hover:text-white flex items-center gap-1.5 transition-all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/></svg>
          <span id="player-eq-badge">EQ: Plano</span>
        </button>

        <button id="btn-open-sleep" class="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-white/70 hover:text-white flex items-center gap-1.5 transition-all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="player-sleep-badge">Timer</span>
        </button>
      </div>
    </section>

    <!-- VIEW 2: LOCAL LIBRARY (MI MÚSICA) -->
    <section id="view-library" class="absolute inset-0 flex flex-col p-5 overflow-y-auto scrollbar-none hidden transition-all duration-300">
      <div class="flex items-center justify-between pb-3">
        <div>
          <h2 class="text-lg font-bold text-white">Mi Música Offline</h2>
          <p class="text-xs text-white/50"><span id="library-total-count">0</span> canciones en tu dispositivo</p>
        </div>
        <button id="btn-refresh-library" class="p-2 rounded-xl bg-white/10 text-white/70 hover:text-white">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
        </button>
      </div>

      <!-- Library Filter Tabs -->
      <div class="flex gap-2 pb-3 overflow-x-auto scrollbar-none flex-shrink-0">
        <button class="btn-lib-filter px-3.5 py-1.5 rounded-full text-xs font-semibold bg-sonic-green text-black" data-tab="all">Todas</button>
        <button class="btn-lib-filter px-3.5 py-1.5 rounded-full text-xs font-medium bg-white/5 text-white/70 border border-white/10" data-tab="favs">Favoritas (❤️)</button>
        <button class="btn-lib-filter px-3.5 py-1.5 rounded-full text-xs font-medium bg-white/5 text-white/70 border border-white/10" data-tab="recent">Historial</button>
      </div>

      <!-- Track List -->
      <div class="flex-1 divide-y divide-white/5 space-y-2 py-2" id="library-tracks-container">
        <!-- Dynamic tracks rendered by JS -->
      </div>
    </section>

    <!-- VIEW 3: DOWNLOADS HUB -->
    <section id="view-downloads" class="absolute inset-0 flex flex-col p-5 overflow-y-auto scrollbar-none hidden transition-all duration-300">
      <div class="flex items-center justify-between pb-3">
        <div>
          <h2 class="text-lg font-bold text-white">Centro de Descargas</h2>
          <p class="text-xs text-white/50">Música guardada en /Music/SpotMusic</p>
        </div>
        <button id="btn-clear-downloads" class="text-xs text-white/50 hover:text-white px-2.5 py-1 rounded-xl bg-white/5">
          Limpiar
        </button>
      </div>

      <!-- Downloads Tasks List -->
      <div class="flex-1 space-y-3 py-2" id="downloads-tasks-container">
        <div class="py-20 text-center text-white/40 flex flex-col items-center justify-center gap-3">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <p class="text-xs">No hay descargas activas en este momento</p>
        </div>
      </div>
    </section>

  </main>

  <!-- FLOATING BOTTOM DOCK NAVIGATION (PILL) -->
  <nav class="pb-[calc(var(--sab)+8px)] pt-2 px-5 bg-obsidian-900/90 backdrop-blur-2xl border-t border-white/10 z-30 flex-shrink-0">
    <div class="max-w-xs mx-auto bg-obsidian-800/90 border border-white/10 rounded-full p-1.5 flex items-center justify-around shadow-2xl">
      
      <!-- Player Tab -->
      <button id="nav-btn-player" class="nav-dock-btn flex-1 py-2 rounded-full flex flex-col items-center gap-1 text-sonic-green font-bold text-[10px] transition-all" data-view="view-player">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="#07090E"/></svg>
        <span>Reproductor</span>
      </button>

      <!-- Library Tab -->
      <button id="nav-btn-library" class="nav-dock-btn flex-1 py-2 rounded-full flex flex-col items-center gap-1 text-white/50 hover:text-white font-medium text-[10px] transition-all" data-view="view-library">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Mi Música</span>
      </button>

      <!-- Downloads Tab -->
      <button id="nav-btn-downloads" class="nav-dock-btn flex-1 py-2 rounded-full flex flex-col items-center gap-1 text-white/50 hover:text-white font-medium text-[10px] transition-all relative" data-view="view-downloads">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Descargas</span>
        <span id="nav-downloads-badge" class="hidden absolute top-1 right-5 w-2 h-2 rounded-full bg-sonic-green"></span>
      </button>

    </div>
  </nav>

  <script type="module" src="./main.ts"></script>
</body>
</html>
